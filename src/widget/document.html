<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FOI document</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --bg2: var(--color-background-secondary, #f5f5f4);
    --fg: var(--color-text-primary, #1c1917);
    --fg2: var(--color-text-secondary, #57534e);
    --line: var(--color-border-primary, #e7e5e4);
    --info: var(--color-text-info, #1d4ed8);
    --ok: var(--color-text-success, #15803d);
    --warn: var(--color-text-warning, #b45309);
    --bad: var(--color-text-danger, #b91c1c);
    --slot: #fdf0b3;
    --radius: var(--border-radius-md, 8px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1c1917);
      --bg2: var(--color-background-secondary, #292524);
      --fg: var(--color-text-primary, #fafaf9);
      --fg2: var(--color-text-secondary, #a8a29e);
      --line: var(--color-border-primary, #44403c);
      --info: var(--color-text-info, #93c5fd);
      --ok: var(--color-text-success, #86efac);
      --warn: var(--color-text-warning, #fcd34d);
      --bad: var(--color-text-danger, #fca5a5);
      --slot: #5c4a12;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1c1917);
    --bg2: var(--color-background-secondary, #292524);
    --fg: var(--color-text-primary, #fafaf9);
    --fg2: var(--color-text-secondary, #a8a29e);
    --line: var(--color-border-primary, #44403c);
    --info: var(--color-text-info, #93c5fd);
    --ok: var(--color-text-success, #86efac);
    --warn: var(--color-text-warning, #fcd34d);
    --bad: var(--color-text-danger, #fca5a5);
    --slot: #5c4a12;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
  #app { padding: 14px 16px 16px; max-width: 760px; }
  .muted { color: var(--fg2); }
  .head { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .kind { color: var(--fg2); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  h1 { font-size: 17px; margin: 2px 0 0; line-height: 1.3; }
  .sub { color: var(--fg2); font-size: 12.5px; margin-top: 2px; }
  .figures { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .fig { flex: 1 1 140px; background: var(--bg2); border-radius: var(--radius); padding: 8px 10px; }
  .fig-label { color: var(--fg2); font-size: 12px; }
  .fig-value { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .flags { margin-top: 12px; border-left: 3px solid var(--warn); background: var(--bg2); border-radius: 0 var(--radius) var(--radius) 0; padding: 8px 12px; }
  .flags p { margin: 4px 0; }
  .slots { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
  .slots-title { width: 100%; font-weight: 600; }
  .slot { background: var(--slot); color: var(--fg); border-radius: 4px; padding: 1px 6px; font-size: 12.5px; }
  mark.slot { font-size: inherit; }
  .done { margin-top: 12px; color: var(--ok); font-weight: 600; }
  details { margin: 10px 0 0; }
  summary { cursor: pointer; font-weight: 600; }
  details ul { margin: 6px 0 0; padding-left: 18px; }
  .doc { margin-top: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); max-height: 420px; overflow: auto; }
  .doc h2, .doc h3, .doc h4, .doc h5 { font-size: 14.5px; margin: 14px 0 4px; }
  .doc h2:first-child, .doc h3:first-child { margin-top: 0; }
  .doc p { margin: 6px 0; }
  .doc ul, .doc ol { margin: 6px 0; padding-left: 20px; }
  .doc li.check { list-style: none; margin-left: -18px; }
  .doc .box { display: inline-block; width: 18px; color: var(--fg2); }
  .doc blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid var(--line); color: var(--fg2); }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .doc pre { white-space: pre-wrap; background: var(--bg2); padding: 8px; border-radius: 6px; font-size: 12px; }
  .doc code { font-size: 12.5px; }
  .doc .table { overflow-x: auto; }
  .doc table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .doc th, .doc td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
  button { font: inherit; font-weight: 600; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--info); }
  button.primary { background: var(--info); border-color: var(--info); color: var(--bg); }
</style>
</head>
<body>
<main id="app"></main>
<script>/*__WIDGET_JS__*/</script>
</body>
</html>
