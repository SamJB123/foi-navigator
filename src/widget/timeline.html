<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FOI deadline timeline</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --bg2: var(--color-background-secondary, #f5f5f4);
    --fg: var(--color-text-primary, #1c1917);
    --fg2: var(--color-text-secondary, #57534e);
    --line: var(--color-border-primary, #e7e5e4);
    --info: var(--color-text-info, #1d4ed8);
    --ok: var(--color-text-success, #15803d);
    --warn: var(--color-text-warning, #b45309);
    --bad: var(--color-text-danger, #b91c1c);
    --radius: var(--border-radius-md, 8px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1c1917);
      --bg2: var(--color-background-secondary, #292524);
      --fg: var(--color-text-primary, #fafaf9);
      --fg2: var(--color-text-secondary, #a8a29e);
      --line: var(--color-border-primary, #44403c);
      --info: var(--color-text-info, #93c5fd);
      --ok: var(--color-text-success, #86efac);
      --warn: var(--color-text-warning, #fcd34d);
      --bad: var(--color-text-danger, #fca5a5);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1c1917);
    --bg2: var(--color-background-secondary, #292524);
    --fg: var(--color-text-primary, #fafaf9);
    --fg2: var(--color-text-secondary, #a8a29e);
    --line: var(--color-border-primary, #44403c);
    --info: var(--color-text-info, #93c5fd);
    --ok: var(--color-text-success, #86efac);
    --warn: var(--color-text-warning, #fcd34d);
    --bad: var(--color-text-danger, #fca5a5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
  #app { padding: 14px 16px 16px; max-width: 760px; }
  .muted { color: var(--fg2); }
  .head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .ref { font-weight: 600; font-size: 15px; }
  .status { color: var(--fg2); }
  .head.danger .status { color: var(--bad); font-weight: 600; }
  .head.warning .status { color: var(--warn); }
  .head.info .status { color: var(--info); }
  .head.success .status { color: var(--ok); }
  .due { text-align: right; }
  .due-label { color: var(--fg2); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .due-date { font-size: 18px; font-weight: 650; }
  .due-left { color: var(--fg2); }
  .head.warning .due-left { color: var(--warn); font-weight: 600; }
  .bar { height: 6px; background: var(--bg2); border-radius: 99px; margin: 10px 0 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--info); }
  .calc { color: var(--fg2); font-size: 12.5px; margin: 6px 0 10px; }
  .dates { list-style: none; padding: 0; margin: 0 0 8px; }
  .dates li { display: grid; grid-template-columns: 18px 120px 1fr auto; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .dates .icon { text-align: center; font-weight: 700; color: var(--fg2); }
  .dates .date { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dates .k-deadline .label { font-weight: 600; }
  .dates .s-met .icon { color: var(--ok); }
  .dates .s-missed .icon, .dates .s-overdue .icon { color: var(--bad); }
  .dates .s-overdue .label { color: var(--bad); }
  .dates .s-due_today .icon, .dates .s-due_today .label { color: var(--warn); }
  .dates .s-upcoming .icon { color: var(--info); }
  .dates em { color: var(--fg2); font-style: normal; font-weight: 400; }
  .prov { color: var(--fg2); font-size: 12px; white-space: nowrap; }
  details { margin: 8px 0; }
  summary { cursor: pointer; font-weight: 600; }
  details ul { margin: 6px 0 0; padding-left: 18px; }
  details li { margin: 3px 0; }
  .note { color: var(--fg2); font-size: 12.5px; }
  .add { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; padding: 10px; background: var(--bg2); border-radius: var(--radius); }
  .add-title { width: 100%; font-weight: 600; }
  .add select, .add input, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .add select[name="type"] { flex: 1 1 260px; min-width: 0; }
  .add input[name="days"] { width: 80px; }
  button { cursor: pointer; font-weight: 600; }
  button:hover { border-color: var(--info); }
  .actions { margin-top: 10px; }
  @media (max-width: 520px) {
    .dates li { grid-template-columns: 18px 1fr; }
    .dates .label, .dates .prov { grid-column: 2; }
    .head { flex-direction: column; }
    .due { text-align: left; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script>/*__WIDGET_JS__*/</script>
</body>
</html>
