<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FOI view</title>
<style>
  /* A registry file on the desk: the host's own paper and ink, registry-blue for anything
     you act on, and a highlighter for what is still to fill. Colour carries meaning
     (towards / part / away / open; ok / warn / stop) and always travels with a word.
     Hosts sandbox the frame with no network, so type is the system's. */
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --bg2: var(--color-background-secondary, #f3f5f2);
    --fg: var(--color-text-primary, #16202a);
    --fg2: var(--color-text-secondary, #4a5866);
    --line: var(--color-border-primary, #d6ddd8);
    --accent: #1f5f8b;
    --accent-soft: #e3eef6;
    --on-accent: #ffffff;
    --hl: #f3dc6b;
    --hl-ink: #16202a;
    --ok: #1d7a4f;
    --ok-soft: #e1f2e9;
    --warn: #96570a;
    --warn-soft: #fbf0d9;
    --bad: #b3261e;
    --bad-soft: #fbe7e5;
    --away: #55606b;
    --away-soft: #e9ecee;
    --info: var(--accent);
    --slot: var(--hl);
    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(22, 32, 42, 0.06), 0 6px 16px rgba(22, 32, 42, 0.05);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #131a20);
      --bg2: var(--color-background-secondary, #1b252d);
      --fg: var(--color-text-primary, #e8edf0);
      --fg2: var(--color-text-secondary, #9fb0bc);
      --line: var(--color-border-primary, #2b3842);
      --accent: #7db7e0; --accent-soft: #1b3142; --on-accent: #0d1a24;
      --hl: #8a7420; --hl-ink: #fff8d6;
      --ok: #63c79a; --ok-soft: #173326;
      --warn: #f0b45c; --warn-soft: #3a2c12;
      --bad: #f08a83; --bad-soft: #3f1d1a;
      --away: #a9b4bd; --away-soft: #2a333b;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #131a20);
    --bg2: var(--color-background-secondary, #1b252d);
    --fg: var(--color-text-primary, #e8edf0);
    --fg2: var(--color-text-secondary, #9fb0bc);
    --line: var(--color-border-primary, #2b3842);
    --accent: #7db7e0; --accent-soft: #1b3142; --on-accent: #0d1a24;
    --hl: #8a7420; --hl-ink: #fff8d6;
    --ok: #63c79a; --ok-soft: #173326;
    --warn: #f0b45c; --warn-soft: #3a2c12;
    --bad: #f08a83; --bad-soft: #3f1d1a;
    --away: #a9b4bd; --away-soft: #2a333b;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.55 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); -webkit-font-smoothing: antialiased; }
  #app { padding: 16px 16px 18px; max-width: 860px; }
  a { color: var(--accent); text-underline-offset: 2px; }
  .muted { color: var(--fg2); }
  .small { font-size: 12.5px; }
  h1 { font-size: 21px; font-weight: 750; letter-spacing: -0.015em; margin: 4px 0 0; line-height: 1.2; text-wrap: balance; }
  h2 { font-size: 15px; font-weight: 700; letter-spacing: -0.005em; margin: 22px 0 8px; }
  h3 { font-size: 13.5px; font-weight: 700; margin: 14px 0 4px; }
  p { margin: 6px 0; }
  ul, ol { margin: 6px 0; padding-left: 20px; }
  li { margin: 3px 0; }
  li::marker { color: var(--fg2); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* Header: a file tab */
  .head { padding: 0 0 12px 12px; border-left: 4px solid var(--accent); margin-bottom: 14px; }
  .kind { display: inline-block; font: 600 11px/1.6 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .sub { color: var(--fg2); font-size: 13px; margin-top: 4px; }
  .back { margin-bottom: 10px; }

  /* Case file: a docket */
  .case { margin: 0 0 14px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; font-size: 13px; }
  .case-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); margin: 0 -1px -1px 0; }
  .case-grid .cell { background: var(--bg); padding: 8px 12px; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .case-grid .cell.due { background: var(--accent-soft); }
  .case .k, .k { display: block; font: 600 10.5px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--fg2); }
  .case .v { font-weight: 600; overflow-wrap: anywhere; }
  .case .cell.due .v { color: var(--accent); font-weight: 750; }
  .case details { margin: 0; padding: 6px 12px; border: 0; border-radius: 0; background: var(--bg2); }
  .case details summary, .case details[open] summary { font-size: 12.5px; padding: 0; border: 0; background: none; }
  .case details > :not(summary) { margin-left: 0; margin-right: 0; }
  .case .none { padding: 6px 12px; background: var(--bg2); }

  .banner { margin: 12px 0; padding: 10px 14px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 var(--radius) var(--radius) 0; }
  .banner > b:first-child { display: block; }
  .banner.ok { border-color: var(--ok); background: var(--ok-soft); }
  .banner.warn { border-color: var(--warn); background: var(--warn-soft); }
  .banner.stop { border-color: var(--bad); background: var(--bad-soft); }
  .banner.stop > b:first-child { color: var(--bad); }
  .banner.warn > b:first-child { color: var(--warn); }
  .banner ul { margin: 4px 0 0; }
  .banner button { margin-top: 6px; }
  .flag { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .flag-factor { font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .slot, mark.slot { background: var(--hl); color: var(--hl-ink); border-radius: 4px; padding: 1px 6px; font-size: 12.5px; }
  mark.slot { font-size: inherit; }
  .calc { text-decoration: underline dotted var(--accent); text-underline-offset: 3px; cursor: help; }

  .figures { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .fig { flex: 1 1 150px; border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: var(--radius); padding: 10px 12px; }
  .fig-label { font: 600 10.5px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--fg2); }
  .fig-value { font-size: 26px; font-weight: 750; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .fig-value.struck { text-decoration: line-through; color: var(--fg2); }

  .table { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  thead th { background: var(--bg2); color: var(--fg2); font: 600 10.5px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  tfoot th { border-bottom: 0; border-top: 2px solid var(--line); background: var(--bg2); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.deduct td { color: var(--ok); }
  table.factors input[type="text"] { width: 100%; min-width: 200px; }

  .block { margin: 12px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); }
  blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--hl); }
  .doc { margin: 12px 0; padding: 20px 22px; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); max-height: 560px; overflow: auto; }
  .doc h2, .doc h3, .doc h4, .doc h5 { font-size: 14.5px; margin: 16px 0 4px; }
  .doc h2:first-child, .doc h3:first-child { margin-top: 0; }
  .doc .table { border: 0; border-radius: 0; }
  .doc li.check, ul.checks li { list-style: none; margin-left: -20px; }
  .doc .box { display: inline-block; width: 18px; color: var(--fg2); }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  pre { white-space: pre-wrap; background: var(--bg2); padding: 10px 12px; border-radius: 8px; font: 12px/1.55 var(--mono); }
  pre.act { max-height: 320px; overflow: auto; }

  ul.checks { padding-left: 20px; }
  ul.checks li { margin: 0; }
  ul.checks label { display: flex; gap: 9px; align-items: baseline; cursor: pointer; padding: 5px 8px; border-radius: 8px; }
  ul.checks label:hover { background: var(--bg2); }
  ul.checks input { accent-color: var(--accent); flex: 0 0 auto; transform: translateY(2px); }
  ul.checks input:checked + span { color: var(--fg2); }

  details { margin: 6px 0 0; border: 1px solid var(--line); border-radius: var(--radius); }
  details > summary { cursor: pointer; font-weight: 650; padding: 8px 12px; list-style: none; display: flex; align-items: center; gap: 8px; border-radius: var(--radius); }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: ""; flex: 0 0 auto; width: 6px; height: 6px; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(-45deg); transition: transform 0.15s; }
  details[open] > summary::before { transform: rotate(45deg); }
  details > summary:hover { background: var(--bg2); }
  details[open] > summary { border-bottom: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; }
  details > :not(summary) { margin-left: 12px; margin-right: 12px; }
  details > :last-child:not(summary) { margin-bottom: 10px; }
  details > ul, details > ol { padding-left: 32px; }

  .rows { list-style: none; padding: 0; }
  .erow { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); margin: 0 0 6px; }
  .erow:hover { border-color: var(--accent); }
  .erow-main b:first-child { font-family: var(--mono); color: var(--accent); margin-right: 4px; }
  .erow-actions { flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
  .erow-actions button { white-space: nowrap; }
  .badge { display: inline-block; font: 600 10.5px/1.7 var(--mono); letter-spacing: 0.03em; border-radius: 99px; padding: 0 8px; color: var(--fg2); background: var(--bg2); vertical-align: 1px; }
  .badge.cond { background: var(--warn-soft); color: var(--warn); }
  .cite-card { padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0; margin: 8px 0; }
  .cite-card p { margin: 4px 0; }

  /* Process map */
  .stepper { list-style: none; padding: 0; margin: 12px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .stage { margin: 0; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; background: var(--bg); }
  .stage-title { display: flex; gap: 8px; align-items: baseline; font-weight: 700; font-size: 13px; line-height: 1.3; margin-bottom: 8px; }
  .stage-title .n { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 11px var(--mono); background: var(--bg2); color: var(--fg2); }
  .stage.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .stage.current .stage-title .n { background: var(--accent); color: var(--on-accent); }
  .stage.done .stage-title .n { background: var(--ok-soft); color: var(--ok); }
  .stage ul { list-style: none; padding: 0; margin: 0; }
  .stage li { margin: 2px 0; }
  button.step { width: 100%; text-align: left; font-weight: 500; font-size: 12.5px; line-height: 1.35; padding: 5px 8px 5px 22px; border: 0; background: none; border-radius: 6px; position: relative; }
  button.step::before { content: ""; position: absolute; left: 8px; top: 11px; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--line); }
  button.step:hover { background: var(--bg2); }
  button.step.current { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  button.step.current::before { background: var(--accent); border-color: var(--accent); }
  button.step.done { color: var(--fg2); }
  button.step.done::before { background: var(--ok); border-color: var(--ok); }
  .step-detail { border-top: 1px solid var(--line); margin-top: 14px; }

  /* Evidence matrix */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 12px 0 8px; }
  .tile { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; border-top: 3px solid var(--line); }
  .tile-n { font-size: 24px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .tile-l { font-size: 12px; color: var(--fg2); line-height: 1.3; }
  .tile.towards { border-top-color: var(--accent); } .tile.towards .tile-n { color: var(--accent); }
  .tile.part { border-top-color: var(--warn); } .tile.part .tile-n { color: var(--warn); }
  .tile.away { border-top-color: var(--away); } .tile.away .tile-n { color: var(--away); }
  .tile.zero .tile-n { color: var(--fg2); opacity: 0.55; }
  @media (max-width: 460px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  table.ov th, table.ov td { padding: 6px 8px; vertical-align: middle; }
  table.ov th.q, table.ov td.q { text-align: center; width: 54px; padding-left: 3px; padding-right: 3px; }
  table.ov td.doc { font-weight: 600; overflow-wrap: anywhere; }
  table.ov td.doc .i { font: 600 11px var(--mono); color: var(--fg2); margin-right: 6px; }
  table.ov td.doc { min-width: 132px; }
  @media (max-width: 520px) {
    table.ov th.q, table.ov td.q { width: 40px; padding-left: 2px; padding-right: 2px; }
    table.ov .lean { min-width: 34px; padding: 1px 3px; }
  }
  table.ov tbody tr { cursor: pointer; }
  table.ov tbody tr:hover td { background: var(--bg2); }
  .lean { display: inline-block; min-width: 42px; padding: 1px 6px; border-radius: 6px; font-size: 12px; font-weight: 650; text-align: center; white-space: nowrap; }
  .lean.towards { background: var(--accent-soft); color: var(--accent); }
  .lean.part { background: var(--warn-soft); color: var(--warn); }
  .lean.away { background: var(--away-soft); color: var(--away); }
  .lean.open { color: var(--fg2); border: 1px dashed var(--line); font-weight: 500; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .pill.towards { background: var(--accent); color: var(--on-accent); }
  .pill.part { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
  .pill.away { background: var(--away); color: var(--bg); }
  .pill.open { color: var(--fg2); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fg2); margin: 6px 2px 0; }
  .legend b { color: var(--fg); font: 700 11px var(--mono); }

  .mx-card { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--radius); margin: 12px 0; background: var(--bg); box-shadow: var(--shadow); scroll-margin-top: 12px; }
  .mx-card.towards { border-left-color: var(--accent); }
  .mx-card.part { border-left-color: var(--warn); }
  .mx-card.away { border-left-color: var(--away); }
  .mx-head { display: flex; gap: 10px; align-items: center; padding: 10px 12px 8px; }
  .mx-idx { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 11.5px var(--mono); background: var(--bg2); color: var(--fg2); }
  input.mx-doc { flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 700; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; padding: 3px 2px; background: none; }
  input.mx-doc:hover, input.mx-doc:focus { border-bottom: 1px solid var(--accent); outline: none; }
  input.mx-doc::placeholder, textarea::placeholder { color: var(--fg2); opacity: 0.75; font-weight: 400; }
  .mx-q { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 7px 12px; border-top: 1px solid var(--line); }
  button.mx-qname { flex: 1 1 210px; min-width: 0; display: flex; gap: 8px; align-items: baseline; text-align: left; border: 0; background: none; padding: 0; font-weight: 600; font-size: 13px; line-height: 1.35; }
  button.mx-qname:hover .qt { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .qn { flex: 0 0 auto; font: 700 11px var(--mono); color: var(--accent); }
  .prov { font: 500 11px var(--mono); color: var(--fg2); white-space: nowrap; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .opt { position: relative; cursor: pointer; }
  .opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .opt span { display: block; padding: 3px 11px; border-radius: 99px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--fg2); white-space: nowrap; transition: background 0.12s, border-color 0.12s, color 0.12s; }
  .opt:hover span { border-color: var(--accent); color: var(--fg); }
  .opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt[data-lean="towards"] input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .opt[data-lean="part"] input:checked + span { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .opt[data-lean="away"] input:checked + span { background: var(--away); border-color: var(--away); color: var(--bg); }
  .opt[data-lean="open"] input:checked + span { border-style: dashed; border-color: var(--fg2); color: var(--fg); background: var(--bg2); }
  .mx-ev { display: block; padding: 8px 12px 10px; border-top: 1px solid var(--line); }
  .mx-ev textarea { width: 100%; margin-top: 3px; }
  .mx-out { padding: 9px 12px; border-top: 1px solid var(--line); background: var(--bg2); border-radius: 0 0 var(--radius) 0; font-size: 13px; }
  .mx-out .pill { margin-right: 6px; }
  .mx-out .why { margin-top: 4px; color: var(--fg2); }
  button.mx-add { width: 100%; padding: 12px; border: 1.5px dashed var(--line); background: none; color: var(--accent); border-radius: var(--radius); }
  button.mx-add:hover { border-color: var(--accent); background: var(--accent-soft); }
  button.x { border: 0; background: none; color: var(--fg2); padding: 2px 6px; font-size: 14px; }
  button.x:hover { color: var(--bad); }
  .yn { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .yn > div { border-radius: 8px; padding: 8px 10px; background: var(--bg2); }
  .yn .k { margin-bottom: 2px; }
  .yn ul { padding-left: 18px; margin: 2px 0; }

  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .status { color: var(--fg2); font-size: 12.5px; }
  button { font: inherit; font-weight: 600; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: border-color 0.12s, background 0.12s; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover { filter: brightness(1.08); }
  button.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; }
  input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: vertical; line-height: 1.45; }
  .caveats { margin-top: 16px; color: var(--fg2); font-size: 12px; }
  .caveats p { margin: 3px 0; }
</style>
</head>
<body>
<main id="app"></main>
<script>/*__WIDGET_JS__*/</script>
</body>
</html>
