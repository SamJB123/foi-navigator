<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FOI view</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --bg2: var(--color-background-secondary, #f5f5f4);
    --fg: var(--color-text-primary, #1c1917);
    --fg2: var(--color-text-secondary, #57534e);
    --line: var(--color-border-primary, #e7e5e4);
    --info: var(--color-text-info, #1d4ed8);
    --ok: var(--color-text-success, #15803d);
    --warn: var(--color-text-warning, #b45309);
    --bad: var(--color-text-danger, #b91c1c);
    --slot: #fdf0b3;
    --radius: var(--border-radius-md, 8px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1c1917);
      --bg2: var(--color-background-secondary, #292524);
      --fg: var(--color-text-primary, #fafaf9);
      --fg2: var(--color-text-secondary, #a8a29e);
      --line: var(--color-border-primary, #44403c);
      --info: var(--color-text-info, #93c5fd);
      --ok: var(--color-text-success, #86efac);
      --warn: var(--color-text-warning, #fcd34d);
      --bad: var(--color-text-danger, #fca5a5);
      --slot: #5c4a12;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1c1917);
    --bg2: var(--color-background-secondary, #292524);
    --fg: var(--color-text-primary, #fafaf9);
    --fg2: var(--color-text-secondary, #a8a29e);
    --line: var(--color-border-primary, #44403c);
    --info: var(--color-text-info, #93c5fd);
    --ok: var(--color-text-success, #86efac);
    --warn: var(--color-text-warning, #fcd34d);
    --bad: var(--color-text-danger, #fca5a5);
    --slot: #5c4a12;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
  #app { padding: 14px 16px 16px; max-width: 820px; }
  a { color: var(--info); }
  .muted { color: var(--fg2); }
  .small { font-size: 12.5px; }
  h1 { font-size: 17px; margin: 2px 0 0; line-height: 1.3; }
  h2 { font-size: 14.5px; margin: 16px 0 6px; }
  h3 { font-size: 13.5px; margin: 12px 0 4px; }
  p { margin: 6px 0; }
  ul, ol { margin: 6px 0; padding-left: 20px; }
  li { margin: 3px 0; }
  .head { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .kind { color: var(--fg2); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .sub { color: var(--fg2); font-size: 12.5px; margin-top: 2px; }
  .back { margin-bottom: 8px; }

  .case { margin: 10px 0; padding: 8px 10px; background: var(--bg2); border-radius: var(--radius); font-size: 13px; }
  .case-row { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .case .k { color: var(--fg2); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; margin-right: 2px; }
  .case details { margin-top: 4px; }

  .banner { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--info); background: var(--bg2); border-radius: 0 var(--radius) var(--radius) 0; }
  .banner.ok { border-color: var(--ok); }
  .banner.warn { border-color: var(--warn); }
  .banner.stop { border-color: var(--bad); }
  .banner.stop > b:first-child { color: var(--bad); }
  .banner ul { margin: 4px 0 0; }
  .flag { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .flag-factor { font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .slot, mark.slot { background: var(--slot); color: var(--fg); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  mark.slot { font-size: inherit; }
  .calc { text-decoration: underline dotted var(--info); text-underline-offset: 3px; cursor: help; }

  .figures { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .fig { flex: 1 1 150px; background: var(--bg2); border-radius: var(--radius); padding: 8px 10px; }
  .fig-label { color: var(--fg2); font-size: 12px; }
  .fig-value { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .fig-value.struck { text-decoration: line-through; color: var(--fg2); }

  .table { overflow-x: auto; margin: 8px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
  thead th { color: var(--fg2); font-weight: 600; font-size: 12px; }
  tfoot th { border-bottom: 0; border-top: 2px solid var(--line); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.deduct td { color: var(--ok); }
  table.factors input[type="text"] { width: 100%; min-width: 200px; }
  table.factors tr.bad td.state { color: var(--bad); font-weight: 600; }
  table.factors tr.warn td.state { color: var(--warn); font-weight: 600; }
  td.state { white-space: nowrap; }

  .block { margin: 12px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); }
  blockquote { margin: 8px 0; padding: 2px 10px; border-left: 3px solid var(--line); }
  .doc { margin: 10px 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); max-height: 520px; overflow: auto; }
  .doc h2, .doc h3, .doc h4, .doc h5 { font-size: 14.5px; margin: 14px 0 4px; }
  .doc h2:first-child, .doc h3:first-child { margin-top: 0; }
  .doc li.check, ul.checks li { list-style: none; margin-left: -18px; }
  .doc .box { display: inline-block; width: 18px; color: var(--fg2); }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  pre { white-space: pre-wrap; background: var(--bg2); padding: 8px; border-radius: 6px; font-size: 12px; }
  pre.act { max-height: 320px; overflow: auto; }
  ul.checks label { display: flex; gap: 6px; align-items: baseline; cursor: pointer; }
  details { margin: 8px 0 0; }
  summary { cursor: pointer; font-weight: 600; }

  .rows { list-style: none; padding: 0; }
  .erow { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); margin: 0; }
  .erow-actions { flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
  .erow-actions button { white-space: nowrap; }
  .badge { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; color: var(--fg2); vertical-align: 1px; }
  .badge.cond { border-color: var(--warn); color: var(--warn); }
  .cite-card { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .cite-card p { margin: 4px 0; }

  .stepper { list-style: none; padding: 0; margin: 10px 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  @media (max-width: 640px) { .stepper { grid-template-columns: 1fr; } }
  .stage { margin: 0; }
  .stage-title { font-weight: 650; font-size: 12.5px; padding-bottom: 4px; border-bottom: 3px solid var(--line); margin-bottom: 4px; }
  .stage.current .stage-title { border-color: var(--info); }
  .stage.done .stage-title { border-color: var(--ok); }
  .stage ul { list-style: none; padding: 0; margin: 0; }
  .stage li { margin: 2px 0; }
  button.step { width: 100%; text-align: left; font-weight: 500; font-size: 12px; padding: 4px 6px; }
  button.step.current { background: var(--info); border-color: var(--info); color: var(--bg); font-weight: 650; }
  button.step.done { color: var(--ok); }
  .step-detail { border-top: 1px solid var(--line); margin-top: 8px; }

  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; }
  .status { color: var(--fg2); font-size: 12.5px; }
  button { font: inherit; font-weight: 600; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--info); }
  button.primary { background: var(--info); border-color: var(--info); color: var(--bg); }
  button.link { border: 0; background: none; color: var(--info); padding: 2px 4px; }
  input, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .caveats { margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--fg2); font-size: 12px; }
  .caveats p { margin: 3px 0; }
</style>
</head>
<body>
<main id="app"></main>
<script>/*__WIDGET_JS__*/</script>
</body>
</html>
